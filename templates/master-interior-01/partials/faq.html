<section class="sec sec--tint" id="faq">
  <div class="wrap">
    <div class="sec__head sec__head--center">
      <p class="eyebrow">FAQ</p>
      <h2 class="h2">{{ section.heading }}</h2>
    </div>
    <div class="faq">
      {%- for item in section.data['items'] %}
      <details class="faq__row"{% if loop.first %} open{% endif %}>
        <summary>{{ item.question }}</summary>
        <p>{{ item.answer }}</p>
      </details>
      {%- endfor %}
    </div>
  </div>
</section>
