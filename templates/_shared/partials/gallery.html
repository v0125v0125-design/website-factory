<section class="band" id="gallery">
  <div class="container">
    <div class="band__head"><h2 class="h2">{{ section.heading }}</h2></div>
    <ul class="gallery">
      {%- for image in section.data['images'] %}
      <li class="gallery__cell">
        <img src="{{ image.src }}" alt="{{ image.alt }}" loading="lazy" decoding="async">
        {%- if image.caption %}<figcaption class="gallery__caption">{{ image.caption }}</figcaption>{%- endif %}
      </li>
      {%- endfor %}
    </ul>
  </div>
</section>
