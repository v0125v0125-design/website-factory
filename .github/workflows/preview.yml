# 미리보기 발행 — 고객 사이트를 GitHub Pages(gh-pages 브랜치) 로 올린다.
#
#   https://v0125v0125-design.github.io/website-factory/<고객 slug>/
#
# 고객 도메인은 연결하지 않는다. 검수용 임시 주소이고, noindex 와 robots 로 검색을 막는다.
# main 에 주문서나 템플릿이 올라오면 자동으로 다시 올라간다.
name: preview

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "templates/**"
      - "factory/**"
      - "tools/build_previews.py"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow

      - name: 주문서 규격 검사
        run: |
          for brief in examples/master-interior-01.json examples/customers/*.json; do
            python -m factory.cli validate "$brief"
          done

      - name: 미리보기 짓기
        run: python tools/build_previews.py _site

      - name: gh-pages 로 올리기
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "preview: ${GITHUB_SHA::7} 기준 미리보기"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: 주소 알리기
        run: |
          base="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "### 미리보기 발행됨" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 목록: $base/" >> $GITHUB_STEP_SUMMARY
          for dir in _site/*/; do
            slug=$(basename "$dir")
            echo "- $slug: $base/$slug/" >> $GITHUB_STEP_SUMMARY
          done
