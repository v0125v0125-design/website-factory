# 영업 담당자가 손으로 받아 적는 형식. 한글 키를 그대로 씁니다.
상호: 스튜디오 온
업종: 미용실
한줄소개: 머리를 자르는 데 한 시간을 씁니다
소개: |
  1인 살롱입니다. 하루에 여섯 분만 받습니다.

  예약은 전화나 인스타그램 메시지로 받습니다. 시술 전에 머리 상태를
  먼저 보고 가능한 것과 어려운 것을 말씀드립니다.
